    <title>Oscar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (() => {
        let mouse = { x: undefined, y: undefined };

        window.addEventListener("mousemove", (e) => {
          mouse.x = e.x;
          mouse.y = e.y;

          const symbol = document.getElementById("website-symbol");
          const { x, y, width, height } = symbol.getBoundingClientRect();
          const centerX = x + width / 2;
          const centerY = y + height / 2;
          const angle = Math.atan2(mouse.y - centerY, mouse.x - centerX);
          const distance = Math.sqrt(
            Math.pow(mouse.x - centerX, 2) + Math.pow(mouse.y - centerY, 2)
          );
          if (distance < 75) {
            symbol.style.transform = `rotate(${angle}rad)`;
          }
        });
      })();
    </script>
