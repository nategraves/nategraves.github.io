services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3001:3001"
    volumes:
      - ./server:/usr/src/app # Mount local server code for development
      - /usr/src/app/node_modules # Don't mount over node_modules in container
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    ports:
      - "8080:80" # Map host port 8080 to container port 80
    # volumes:
    #   - ./fiveteen/client:/usr/share/nginx/html # Mount local client code for development

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379" # Expose Redis port to host for potential direct access/debugging
    volumes:
      - redis_data:/data

volumes:
  redis_data:
